<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="sweety-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D7A62" />
      <stop offset="100%" stop-color="#1B4D3E" />
    </linearGradient>
    <linearGradient id="droplet-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E8F1EC" />
    </linearGradient>
  </defs>

  <!-- Squircle Base for crisp browser tab contrast -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#sweety-bg)" />
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="#52A78B" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Sweety Clinical Droplet -->
  <path
    d="M32 12C32 12 18 25.5 18 35.5C18 43.5 24.2 49 32 49C39.8 49 46 43.5 46 35.5C46 25.5 32 12 32 12Z"
    fill="url(#droplet-glow)"
  />

  <!-- Glycemic Rhythm Wave & Central S-Curve -->
  <path
    d="M24 37C24.5 37 27 33.5 30 33.5C33 33.5 33.5 38 36.5 38C39 38 40.5 35.5 40.5 35.5"
    stroke="#1E5443"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Capillary test node -->
  <circle cx="32" cy="24.5" r="2.25" fill="#1E5443" />
</svg>
